    <text x="1418" y="255" fill="#17c2ae" fill-opacity=".7">ADV</text>
    <text x="800" y="792" fill="#17c2ae" fill-opacity=".8">BODY SIDE · 4 745 mm</text>
    <text x="230" y="350" fill="#ef4677" fill-opacity=".8">SAFETY ZONE A</text>
    <text x="1300" y="730" fill="#ff7a2f" fill-opacity=".9">R01 · 6-AXIS</text>
    <text x="230" y="730" fill="#ff7a2f" fill-opacity=".8">R02</text>

    <g fill="#f3ead6" fill-opacity=".55" font-size="16">
