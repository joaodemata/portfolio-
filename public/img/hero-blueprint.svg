      <text x="120" y="186">  "amount": 1250.00,</text>
      <text x="120" y="212">  "status": "SETTLED" }</text>
      <text x="120" y="250" fill="#17c2ae" fill-opacity=".7">ws  ▸ order.matched  12 ms</text>
